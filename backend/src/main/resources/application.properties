spring.application.name=backend

# Logging: quiet the local dev console — suppress the startup banner. Levels and the
# console pattern (colorized, compact) live in logback-spring.xml.
spring.main.banner-mode=off

# Actuator: liveness/readiness groups exposed for Docker/orchestrator health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# RagConfig owns EmbeddingModel/VectorStore bean wiring directly (multiple Qdrant
# collections per chunking-config for the eval harness) - disable the single-collection
# autoconfigured Qdrant VectorStore and OpenAI's embedding autoconfig (Groq has no
# embeddings endpoint, so an auto-wired OpenAiEmbeddingModel would just fail at call time).
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

# PostgreSQL (Neon in hosted mode; local Docker Compose `postgres` service otherwise)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/quantedge}
spring.datasource.username=${DATABASE_USERNAME:quantedge}
spring.datasource.password=${DATABASE_PASSWORD:quantedge}

# Redis: Upstash REST API in hosted mode. RedisCacheClient always speaks Upstash's REST protocol,
# never the native Redis wire protocol, so local Docker Compose fronts its plain `redis` container
# with a `redis-http` sidecar (hiett/serverless-redis-http) that translates REST calls to RESP -
# see docker-compose.yml's `local` profile.
upstash.redis.rest-url=${UPSTASH_REDIS_REST_URL:http://redis-http:80}
upstash.redis.rest-token=${UPSTASH_REDIS_REST_TOKEN:local-dev-token}
upstash.redis.timeout-ms=3000

# Security & OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Configuration
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Frontend
app.frontend-url=${FRONTEND_URL}

# Refresh-token cookie: must be false for local HTTP dev, true in any real deployment (HTTPS)
app.cookie-secure=${COOKIE_SECURE:true}

# External market data APIs (Phase 2)
finnhub.api-key=${FINNHUB_API_KEY}
finnhub.base-url=https://finnhub.io/api/v1
finnhub.timeout-ms=5000

twelvedata.api-key=${TWELVE_DATA_API_KEY}
twelvedata.base-url=https://api.twelvedata.com
twelvedata.timeout-ms=5000

# Price sync scheduler: refresh cadence matches PriceCache's 15min TTL (CLAUDE.md Data Strategy).
# inter-call-delay-ms spaces out per-symbol Finnhub calls to stay under the 60/min free-tier limit.
price-sync.fixed-rate-ms=900000
price-sync.inter-call-delay-ms=1100

# GraphQL (reads only, per CLAUDE.md's REST-for-writes/GraphQL-for-reads split)
spring.graphql.graphiql.enabled=true

# Kafka (SASL_SSL against Aiven in hosted mode; PLAINTEXT against local Docker Compose `kafka`
# otherwise) - Phase 3. KAFKA_SECURITY_PROTOCOL/SASL/SSL-bundle settings are env-driven so the same
# properties file works against both without hand-editing per environment.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";}
spring.kafka.ssl.bundle=${KAFKA_SSL_BUNDLE:}
spring.ssl.bundle.pem.aiven-kafka.truststore.certificate=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
# Aiven's free-tier topics are created via the console (Manage stream > Topics), not
# auto-created by the client - don't fail startup if topic auto-creation is rejected.
spring.kafka.admin.fail-fast=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Manual ack: the matcher consumer (Part 2) acks only after its DB transaction commits, so a
# crash before commit redelivers instead of silently dropping the price event.
spring.kafka.consumer.group-id=quantedge-order-matcher
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.quantedge.backend.kafka.dto

app.kafka.topic.stock-prices=stock-prices
app.kafka.topic.executed-trades=executed-trades

# DAY-order expiry sweep: marks OPEN orders past their expires_at as EXPIRED.
order-expiry.fixed-rate-ms=60000

# Export reports (Phase 4): local filesystem base path generated PDFs/CSVs are written to.
export.base-path=${EXPORT_BASE_PATH:./exports}

# Groq (Spring AI, OpenAI-compatible) - Phase 6 (Wait, it's Phase 5 now)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
quantedge.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
quantedge.ai.groq.temperature=0.3
quantedge.ai.groq.max-tokens=2048

# Research agent guardrails (Phase 5 agentic refactor): bounds on the plan/act/observe loop in
# ResearchAgentOrchestrator, independent of any single tool call's own timeout.
quantedge.ai.agent.max-steps=8
quantedge.ai.agent.tool-timeout-seconds=15
quantedge.ai.agent.tool-max-retries=2
quantedge.ai.agent.run-timeout-seconds=120

alphavantage.base-url=https://www.alphavantage.co
alphavantage.api-key=${ALPHA_VANTAGE_API_KEY:demo}
alphavantage.timeout-ms=5000

# Qdrant (vector store, Phase 5 Part 3 - RAG). QDRANT_URL is the Qdrant Cloud REST hostname
# (https://<id>.<region>.aws.cloud.qdrant.io); the gRPC port (6334) and TLS are fixed for
# Qdrant Cloud, so RagConfig parses host out of the URL rather than needing separate env vars.
quantedge.rag.qdrant.url=${QDRANT_URL}
quantedge.rag.qdrant.api-key=${QDRANT_API_KEY}
quantedge.rag.qdrant.grpc-port=6334
quantedge.rag.qdrant.collection=quantedge_knowledge

# Local ONNX embedding model (all-MiniLM-L6-v2, 384-dim) - no external API, no rate limits.
# Groq has no embeddings endpoint, so chat and embeddings intentionally use different models.
# Fixed cache dir (default is java.io.tmpdir, which is wiped between CI runs) so the ~90MB
# model/tokenizer files are only fetched from GitHub once and can be cached by CI.
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-onnx-model
quantedge.rag.embedding.dimension=384

# Chunking defaults for the production queryKnowledgeBase tool (technique experiments in
# phase-5/rag-technique-experiments override these per eval run).
quantedge.rag.chunking.strategy=RECURSIVE
quantedge.rag.chunking.chunk-size=800
quantedge.rag.chunking.chunk-overlap=120

# Daily news ingestion (NewsSyncScheduler -> NewsIngestionService): Finnhub company news, deduped
# and upserted into the same quantedge.rag.qdrant.collection as the static corpus, tagged NEWS.
# lookback-days re-checks the last couple of days on every run (cheap - Qdrant dedup skips
# anything already ingested) so a missed/late Finnhub article from yesterday still gets picked up.
# retention-days is a pure age-based purge, independent of relevance - see NewsIngestionService.
quantedge.rag.news.sync-cron=0 0 6 * * *
quantedge.rag.news.lookback-days=2
quantedge.rag.news.retention-days=90
finnhub.news-sync.inter-call-delay-ms=1100

# Razorpay (wallet top-up, Test Mode)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
quantedge.wallet.exchange-rate=10
