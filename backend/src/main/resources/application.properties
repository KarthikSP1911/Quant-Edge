spring.application.name=backend

# PostgreSQL (Neon)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis (Upstash REST API)
upstash.redis.rest-url=${UPSTASH_REDIS_REST_URL}
upstash.redis.rest-token=${UPSTASH_REDIS_REST_TOKEN}
upstash.redis.timeout-ms=3000

# Security & OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Configuration
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Frontend
app.frontend-url=${FRONTEND_URL}

# Refresh-token cookie: must be false for local HTTP dev, true in any real deployment (HTTPS)
app.cookie-secure=${COOKIE_SECURE:true}

# External market data APIs (Phase 2)
finnhub.api-key=${FINNHUB_API_KEY}
finnhub.base-url=https://finnhub.io/api/v1
finnhub.timeout-ms=5000

twelvedata.api-key=${TWELVE_DATA_API_KEY}
twelvedata.base-url=https://api.twelvedata.com
twelvedata.timeout-ms=5000

# Price sync scheduler: refresh cadence matches PriceCache's 15min TTL (CLAUDE.md Data Strategy).
# inter-call-delay-ms spaces out per-symbol Finnhub calls to stay under the 60/min free-tier limit.
price-sync.fixed-rate-ms=900000
price-sync.inter-call-delay-ms=1100
