# Fast, no-infra test profile: in-memory H2, Flyway disabled.
# Full-schema/integration coverage runs against real Postgres via
# Testcontainers in Phase 5 — this profile is only for pre-push speed.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy values for context loading (must be valid Base64 for JJWT)
jwt.access-secret=c2VjcmV0LWtleS1zaG91bGQtYmUtdmVyeS1sb25nLWFuZC1zZWN1cmU=
jwt.refresh-secret=c2VjcmV0LWtleS1zaG91bGQtYmUtdmVyeS1sb25nLWFuZC1zZWN1cmU=
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy
app.frontend-url=http://localhost:3000

# Dummy values for context loading (external clients are not exercised by fast unit tests)
finnhub.api-key=dummy
finnhub.base-url=https://finnhub.io/api/v1
finnhub.timeout-ms=5000
twelvedata.api-key=dummy
twelvedata.base-url=https://api.twelvedata.com
twelvedata.timeout-ms=5000

upstash.redis.rest-url=http://localhost:8081
upstash.redis.rest-token=dummy
upstash.redis.timeout-ms=3000

alphavantage.base-url=https://www.alphavantage.co
alphavantage.api-key=demo
alphavantage.timeout-ms=5000

# Dummy values for context loading. No live broker in fast unit tests - app.kafka.listener.auto
# -startup is wired into KafkaConsumerConfig's factory so @KafkaListener beans (Part 2's matcher
# /executed-trades consumers) don't spin up real consumer threads against this dummy broker.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.consumer.group-id=quantedge-order-matcher-test
app.kafka.listener.auto-startup=false
app.kafka.topic.stock-prices=stock-prices
app.kafka.topic.executed-trades=executed-trades

# Export reports (Phase 4)
export.base-path=./exports-test

# Dummy values for context loading (external clients are not exercised by fast unit tests)
spring.ai.openai.api-key=dummy
quantedge.ai.groq.model=dummy-model
quantedge.ai.groq.temperature=0.3
quantedge.ai.groq.max-tokens=2048

quantedge.rag.qdrant.enabled=false
quantedge.rag.qdrant.url=http://localhost:6334
quantedge.rag.qdrant.api-key=dummy
quantedge.rag.qdrant.grpc-port=6334
quantedge.rag.qdrant.collection=quantedge_knowledge_test
quantedge.rag.auto-ingest=false
quantedge.rag.chunking.strategy=RECURSIVE
quantedge.rag.chunking.chunk-size=800
quantedge.rag.chunking.chunk-overlap=120
