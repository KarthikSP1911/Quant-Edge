# Fast, no-infra test profile: in-memory H2, Flyway disabled.
# Full-schema/integration coverage runs against real Postgres via
# Testcontainers in Phase 5 — this profile is only for pre-push speed.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy values for context loading (must be valid Base64 for JJWT)
jwt.access-secret=c2VjcmV0LWtleS1zaG91bGQtYmUtdmVyeS1sb25nLWFuZC1zZWN1cmU=
jwt.refresh-secret=c2VjcmV0LWtleS1zaG91bGQtYmUtdmVyeS1sb25nLWFuZC1zZWN1cmU=
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy
app.frontend-url=http://localhost:3000
