# Single-origin reverse proxy for QuantEdge:
#   /api/*, /graphql  -> Spring Boot backend (:8080)
#   everything else   -> Next.js frontend (:3000)
# Serving both from one origin keeps the auth cookies first-party (SameSite=Lax) and removes the
# need for browser CORS preflights. The frontend is built with an empty NEXT_PUBLIC_API_URL so it
# calls relative URLs like /api/orders and /graphql.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upgrade to websocket only when the client asks (Next.js dev HMR); otherwise keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend  { server backend:8080;  keepalive 32; }
    upstream frontend { server frontend:3000; keepalive 16; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # nginx's own liveness probe; does not touch the upstreams.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SSE: order fill notifications and the research agent's reasoning trace. Buffering must
        # be off or events sit in nginx until the buffer fills. The backend emitters time out at
        # 30 minutes, so the read timeout is set just above that.
        location ~ ^/api/(orders/stream|v1/agent/trace/) {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            add_header X-Accel-Buffering no always;
            proxy_read_timeout 1860s;
            proxy_send_timeout 1860s;
        }

        # Chat and the research agent call Groq, which can take well past nginx's 60s default.
        location ~ ^/api/v1/(chat|agent)/ {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
        }

        # Razorpay webhook: the body must reach the backend untouched so the HMAC signature
        # still verifies. nginx forwards it verbatim; this block only pins that intent down.
        location = /api/webhooks/razorpay {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_request_buffering on;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location = /graphql {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Spring Security's OAuth2 login endpoints (Google sign-in). Deliberately not all of /oauth2/:
        # the frontend owns the /oauth2/callback page.
        location ~ ^/(oauth2/authorization|login/oauth2/code)/ {
            proxy_pass http://backend;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
