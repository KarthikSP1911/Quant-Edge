pre-commit:
  parallel: true
  jobs:
    - name: frontend
      root: "frontend/"
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --fix {staged_files} && npx prettier --write {staged_files}
      stage_fixed: true

    - name: backend
      root: "backend/"
      glob: "*.java"
      run: ./mvnw -q spotless:apply
      stage_fixed: true

    - name: general
      glob: "*.{json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit "{1}"

pre-push:
  parallel: true
  jobs:
    - name: backend-test
      root: "backend/"
      run: ./mvnw -q -B test

    - name: frontend-check
      root: "frontend/"
      run: npm run lint && npm run typecheck
