<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1080" width="1720" height="1080" role="img" aria-labelledby="t d">
<title id="t">Quant Edge high-level architecture</title>
<desc id="d">A user reaches an nginx gateway over HTTP. The gateway routes to the Next.js frontend and to four Spring Boot backend modules: market data, orders and portfolio, AI assistant and wallet. Market data uses Redis and Finnhub, Twelve Data and Alpha Vantage, and publishes price events to Kafka, where the order matcher consumes them and writes fills to PostgreSQL. The AI assistant uses Qdrant and Groq. The wallet uses Razorpay. Auth is Google OAuth2 and JWT.</desc>
