name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml

      # No secrets are passed as env vars here: the test classpath's application.properties
      # (src/test/resources) fully overrides the production one and hardcodes dummy values for
      # every external dependency, including *IT tests (Testcontainers overrides only the
      # datasource/broker coordinates via @DynamicPropertySource). Setting a GitHub secret env
      # var that doesn't exist yet still defines it as an empty string, which Spring Boot's
      # relaxed env-var binding would then prefer over the hardcoded property value - this
      # previously zeroed out jwt.access-secret and broke every JWT-backed test.
      - name: mvn clean install (unit + failsafe integration tests)
        run: ./mvnw -B clean install
