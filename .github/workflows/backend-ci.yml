name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      # Backend still compiles to release 21 (pom.xml's java.version) - this just builds it with
      # a current JDK rather than pinning the CI toolchain to Java 21 itself.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache ONNX embedding model
        uses: actions/cache@v5
        with:
          path: ~/.cache/spring-ai-onnx-model
          key: onnx-embedding-model-v1

      - name: Build and verify (tests + JaCoCo 80% gate)
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
